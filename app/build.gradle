plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hcyun.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.hcyun.app"
        minSdk 29
        targetSdk 34
        // ============================================================
        // 版本规则（用户约定）：
        // 当前版本 1.3.2（用户要求版本来到 1.3.*，底栏升级为磨砂玻璃
        // 效果：FrostedBarBg 实时截取底栏后方页面内容 → 降采样模糊 +
        // 70% 半透明白 → 滚动/重绘时 200ms 节流刷新，透过底栏可模糊
        // 看到页面信息；纯 Bitmap 方案兼容 API 26+，非 WebGL 液态玻璃；
        // 四页共用同一套 attachFloatingBar 代码）。
        // 此后每次代码修改发布，versionName 增加 0.0.1，versionCode +1。
        // APK 输出文件名固定为 HC孕_v{版本号}.apk，旧 APK 一律保留，
        // 并追加更新日志。
        // ============================================================
        versionCode 173
        versionName "1.4.13"
    }

    signingConfigs {
        release {
            storeFile file('../hcyun.keystore')
            storePassword 'hcyun2026'
            keyAlias 'hcyun'
            keyPassword 'hcyun2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // MariaDB JDBC 驱动 + jBCrypt（App 直连数据库）
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
